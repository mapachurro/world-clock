name: Deploy with Omnipin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check static site
        run: test -f public/index.html

      - name: Install Omnipin
        run: npm i -g omnipin

      - name: Deploy the site
        run: omnipin deploy public --providers=Filecoin --ens ${{ vars.OMNIPIN_ENS }}
        env:
          OMNIPIN_FILECOIN_TOKEN: ${{ secrets.OMNIPIN_FILECOIN_TOKEN }}
          OMNIPIN_PK: ${{ secrets.OMNIPIN_PK }}